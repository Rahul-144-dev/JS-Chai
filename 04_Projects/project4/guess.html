<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project 4</title>
  <!-- FILE-CREATE:guess.css -->
  <link rel="stylesheet" href="guess.css" />
</head>

<body>
  <div class="wrapper">
    <form class="form">
      <label for="guessField">Guess a Number</label>
      <input type="text" id="guessField">
      <input type="submit" id="submit">
    </form>

    <div class="result">
      <p>Previous Guess: <span class="guesses"></span> </p>
      <p>Guess Remaining: <span class="lastResult">10</span> </p>
      <p class="lowOrHigh"></p>
    </div>
    <div class="new-end">
      <button id="newGame">New Game</button>
      <button id="endGame">End Game</button>
    </div>
  </div>
  <!-- FILE-CREATE:guess.js -->
  <script src="guess.js"></script>
</body>

</html>
