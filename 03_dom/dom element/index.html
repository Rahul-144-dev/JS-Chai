    const createDiv = (BgColor, text) => {
      let div = document.createElement('div');
      div.innerText = text;
      div.style.backgroundColor = BgColor;
      document.body.appendChild(div);
    };

    const obj = [
      { color: 'red', text: "this is red" },
      { color: 'green', text: 'this is green' },
      { color: 'blue', text: 'this is blue' },
      { color: 'orange', text: 'this is orange' },
      { color: 'grey', text: 'this is grey' },
    ];
    obj.forEach((val) => {
      createDiv(val.color, val.text);
    });
    for (const val of obj) {
      createDiv(val.color, val.text);
    }
    for (let key in obj) {
      createDiv(obj[key].color, obj[key].text);
    }
